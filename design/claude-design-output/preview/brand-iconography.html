<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="padding:24px 32px; background:#0B0B0C;">
  <div class="mono mono-foot" style="margin-bottom:18px;">ICONOGRAPHY — TYPE &amp; DOCUMENT MARKS ONLY</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:18px;">
    <div style="text-align:center;">
      <div style="height:60px; display:flex; align-items:center; justify-content:center; font-family:var(--font-body); font-size:40px; color:#ECECEA; font-weight:500;">→</div>
      <div class="mono mono-foot" style="padding-top:8px;">U+2192</div>
      <div class="body-sm" style="color:#8A8A86; padding-top:2px;">CTA arrow only</div>
    </div>
    <div style="text-align:center;">
      <div style="height:60px; display:flex; align-items:center; justify-content:center; font-family:var(--font-body); font-size:40px; color:#E63D2F; font-weight:500;">¹</div>
      <div class="mono mono-foot" style="padding-top:8px;">FOOTNOTE</div>
      <div class="body-sm" style="color:#8A8A86; padding-top:2px;">¹ ² ³ * †</div>
    </div>
    <div style="text-align:center; position:relative;">
      <div style="height:60px; position:relative;">
        <div style="position:absolute; left:50%; top:0; bottom:0; width:1px; background:#54534F;"></div>
        <div style="position:absolute; left:30%; top:8px; font-family:var(--font-mono); font-size:10px; color:#54534F; line-height:1.5;">01<br>02<br>03<br>04</div>
      </div>
      <div class="mono mono-foot" style="padding-top:8px;">LINE NUMBERS</div>
      <div class="body-sm" style="color:#8A8A86; padding-top:2px;">+ court margin rule</div>
    </div>
    <div style="text-align:center;">
      <div style="height:60px; display:flex; align-items:center; justify-content:center;">
        <span class="mono mono-foot" style="color:#ECECEA; letter-spacing:0.12em; font-size:11px;">EX-2.1<br>1 / 312</span>
      </div>
      <div class="mono mono-foot" style="padding-top:8px;">DOC ID</div>
      <div class="body-sm" style="color:#8A8A86; padding-top:2px;">tracking number gravity</div>
    </div>
  </div>
  <div class="body-sm" style="color:#E63D2F; padding-top:14px; border-top:1px solid #2A2A28; margin-top:14px;">
    No emoji. No icon font. No Lucide / Heroicons in marketing surfaces.
  </div>
</body></html>
