<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="padding: 28px 32px; background: #0B0B0C;">
  <div style="display:flex; flex-direction:column; gap:18px;">
    <div class="mono mono-foot">SURFACE</div>
    <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:14px;">
      <div>
        <div style="height:64px; background:#0B0B0C; border:1px solid #2A2A28;"></div>
        <div style="display:flex; justify-content:space-between; padding-top:8px;">
          <span class="mono mono-foot">--surface</span>
          <span class="mono mono-foot">#0B0B0C</span>
        </div>
        <div class="body-sm" style="color:#8A8A86; padding-top:4px;">Near-black, slightly warm. Never #000000.</div>
      </div>
      <div>
        <div style="height:64px; background:#F4F2EC;"></div>
        <div style="display:flex; justify-content:space-between; padding-top:8px;">
          <span class="mono mono-foot">--surface-alt</span>
          <span class="mono mono-foot">#F4F2EC</span>
        </div>
        <div class="body-sm" style="color:#8A8A86; padding-top:4px;">Warm paper. One variant max may use this.</div>
      </div>
    </div>
  </div>
</body></html>
