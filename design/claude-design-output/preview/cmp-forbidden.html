<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="padding:24px 32px; background:#0B0B0C;">
  <div class="mono mono-foot" style="margin-bottom:18px;">FORBIDDEN COMPOSITIONS</div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:14px;">

    <!-- centered hero -->
    <div>
      <div style="height:90px; background:#0B0B0C; border:1px solid #2A2A28; position:relative;">
        <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;">
          <div style="width:60%; height:8px; background:#8A8A86;"></div>
          <div style="width:40%; height:4px; background:#54534F;"></div>
          <div style="display:flex; gap:4px; margin-top:4px;"><div style="width:30px; height:8px; background:#ECECEA;"></div><div style="width:30px; height:8px; background:#54534F;"></div></div>
        </div>
        <div style="position:absolute; inset:0; background:linear-gradient(135deg, transparent 47%, #E63D2F 47%, #E63D2F 53%, transparent 53%);"></div>
      </div>
      <div class="mono mono-foot" style="padding-top:8px; color:#E63D2F;">CENTERED HERO</div>
    </div>

    <!-- card frame -->
    <div>
      <div style="height:90px; background:#0B0B0C; border:1px solid #2A2A28; position:relative;">
        <div style="position:absolute; inset:14px; border:1px solid #54534F; border-radius:8px; background:#1a1a1a;"></div>
        <div style="position:absolute; inset:0; background:linear-gradient(135deg, transparent 47%, #E63D2F 47%, #E63D2F 53%, transparent 53%);"></div>
      </div>
      <div class="mono mono-foot" style="padding-top:8px; color:#E63D2F;">CARD FRAME · ROUNDED</div>
    </div>

    <!-- soft drop shadow -->
    <div>
      <div style="height:90px; background:#0B0B0C; border:1px solid #2A2A28; position:relative;">
        <div style="position:absolute; left:20px; top:18px; right:20px; bottom:18px; background:#ECECEA; box-shadow: 0 12px 28px rgba(255,255,255,0.4), 0 4px 8px rgba(255,255,255,0.2);"></div>
        <div style="position:absolute; inset:0; background:linear-gradient(135deg, transparent 47%, #E63D2F 47%, #E63D2F 53%, transparent 53%);"></div>
      </div>
      <div class="mono mono-foot" style="padding-top:8px; color:#E63D2F;">SOFT DROP SHADOW</div>
    </div>
  </div>
</body></html>
