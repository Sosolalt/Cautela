<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="padding:0; background:#0B0B0C; height:280px; overflow:hidden;">
  <div style="position:relative; height:100%; padding:24px 32px;">
    <div class="mono mono-foot" style="margin-bottom:14px;">EDGE TREATMENT — FLUSH OR GENEROUS · AVOID 24px</div>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; height:180px;">
      <div style="border:1px solid #2A2A28; position:relative;">
        <div style="position:absolute; top:0; left:0; right:0; height:100%; background:#54534F; opacity:0.2;"></div>
        <div style="position:absolute; top:8px; left:8px; right:8px; bottom:8px; background:#ECECEA;"></div>
        <div class="mono mono-foot" style="position:absolute; bottom:6px; right:8px; color:#ECECEA;">FLUSH · 0px</div>
      </div>
      <div style="border:1px solid #2A2A28; position:relative;">
        <div style="position:absolute; top:24px; left:24px; right:24px; bottom:24px; background:#E63D2F;"></div>
        <div style="position:absolute; top:0; left:0; bottom:0; width:1px; background:#E63D2F;"></div>
        <div style="position:absolute; top:0; right:0; bottom:0; width:1px; background:#E63D2F;"></div>
        <div class="mono mono-foot" style="position:absolute; bottom:6px; right:8px; color:#E63D2F;">24px · FORBIDDEN</div>
      </div>
      <div style="border:1px solid #2A2A28; position:relative;">
        <div style="position:absolute; top:48px; left:48px; right:48px; bottom:48px; background:#ECECEA;"></div>
        <div class="mono mono-foot" style="position:absolute; bottom:6px; right:8px;">GENEROUS · 96px+</div>
      </div>
    </div>
  </div>
</body></html>
