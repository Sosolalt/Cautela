<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="padding:24px 32px; background:#0B0B0C;">
  <div class="mono mono-foot" style="margin-bottom:18px;">RADII + SHADOW + DEPTH SYSTEM</div>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;">
    <div>
      <div style="height:80px; background:#ECECEA;"></div>
      <div class="mono mono-foot" style="padding-top:10px;">RADIUS 0</div>
      <div class="body-sm" style="color:#8A8A86; padding-top:2px;">Square corners. Globally locked.</div>
    </div>
    <div>
      <div style="height:80px; background:#0B0B0C; position:relative;">
        <div style="position:absolute; inset:8px; background:#2A2A28;"></div>
        <div style="position:absolute; inset:0; left:16px; top:16px; background:#ECECEA;"></div>
      </div>
      <div class="mono mono-foot" style="padding-top:10px;">DEPTH = OVERLAP</div>
      <div class="body-sm" style="color:#8A8A86; padding-top:2px;">No shadow stack. Use overlap, scale, hairline.</div>
    </div>
    <div>
      <div style="height:80px; background:#0B0B0C; position:relative;">
        <div style="position:absolute; left:0; top:50%; right:0; height:1px; background:#54534F;"></div>
        <div style="position:absolute; left:50%; top:0; bottom:0; width:1px; background:#54534F;"></div>
      </div>
      <div class="mono mono-foot" style="padding-top:10px;">HAIRLINE RULE</div>
      <div class="body-sm" style="color:#8A8A86; padding-top:2px;">1px · #54534F · the only acceptable divider.</div>
    </div>
  </div>
</body></html>
